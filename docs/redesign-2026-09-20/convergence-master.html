<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>毫厘智管 · 现场记录册母版</title>
  <!-- Selected 2026-09-22. This is the visual/interaction specification.
       A project only defines record ownership: no phase, manager, task,
       progress, rectification, or invented site content. -->
  <style>
    :root{--ink:#191816;--paper:#E9E4DD;--field:#F2EEE8;--orange:#DE6E3F;--orange-strong:#C75C35;--muted:#706D67;--line:#C9C1B7;--surface:#E2DCD3;--display:"Songti SC","STSongti-SC-Regular","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;--body:"PingFang SC",-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei","Helvetica Neue",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:#e7dfd2;color:var(--ink);font:16px/1.55 var(--body)}
    button,input,textarea{font:inherit;color:inherit}button{min-height:44px;border:0;background:transparent;cursor:pointer;transition:transform 180ms,opacity 180ms,background 180ms}button:active{transform:scale(.985);opacity:.72}
    .layout{max-width:1120px;min-height:100vh;margin:auto;padding:42px;display:grid;grid-template-columns:1fr 390px;align-items:center;gap:76px}.notes{align-self:start;padding-top:44px}.notes__identity{display:flex;align-items:center;gap:12px}.notes__mark{width:38px;height:38px}.notes__brand{color:var(--ink);font:600 14px/1.4 ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em}.notes h1{max-width:520px;margin:20px 0 18px;font-family:var(--display);font-size:48px;font-weight:500;line-height:1.18;letter-spacing:-.035em}.notes p{max-width:500px;color:var(--muted)}.rules{margin-top:34px;border-top:1px solid var(--line)}.rules div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.rules span:last-child{color:var(--muted);text-align:right}
    .phone{height:812px;background:var(--paper);box-shadow:0 28px 70px rgba(51,42,31,.2);overflow:hidden;display:flex;flex-direction:column}.topbar{min-height:58px;padding:0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:14px}.topbar__brand{font-family:var(--display);font-weight:500;letter-spacing:.03em}.topbar__back{color:var(--ink);padding:0;min-width:44px;text-align:left}.main{flex:1;overflow:auto;padding:28px 22px 20px}.main::-webkit-scrollbar{display:none}.footer{padding:12px 22px;border-top:1px solid var(--line);background:var(--paper)}.hidden{display:none!important}
    .eyebrow{margin-bottom:10px;color:var(--muted);font-size:13px;letter-spacing:.1em}.page-title{margin:0;font-family:var(--body);font-size:34px;font-weight:600;letter-spacing:-.025em;line-height:1.18}.page-title--object{font-family:var(--display);font-weight:500;letter-spacing:.02em}.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.compact{flex:0 0 auto;padding:0 0 0 14px;color:var(--ink);font-size:13px;font-weight:600}
    .search,.text-input,.text-area{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px}.search,.text-input{min-height:48px;padding:0 14px}.text-area{min-height:112px;padding:12px 14px;resize:none;line-height:1.65}.project-card{width:100%;margin-top:14px;padding:18px 0;background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;text-align:left}.project-card__title{font-family:var(--body);font-size:20px;font-weight:600;letter-spacing:0}.project-card__address{margin-top:4px;color:var(--muted);font-size:13px}.project-card__footer{display:flex;justify-content:space-between;gap:12px;margin-top:16px;color:var(--muted);font-size:13px}
    .evidence{margin:26px 0 20px}.evidence__media{position:relative;min-height:292px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center}.evidence__media img{display:block;width:100%;height:292px;object-fit:cover}.evidence__empty{max-width:210px;padding:24px;color:var(--muted);text-align:center;font-size:14px}.evidence__empty strong{display:block;margin-bottom:7px;color:var(--ink);font-family:var(--body);font-size:20px;font-weight:600}.evidence__count{position:absolute;right:12px;bottom:12px;padding:5px 10px;border-radius:999px;background:rgba(28,26,23,.76);color:#fffaf5;font-size:12px}.annotation{position:absolute;top:42%;right:13%;display:none;width:38%;height:28%;border:2px solid var(--orange)}.annotation span{position:absolute;top:-12px;left:-12px;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fffaf5;display:grid;place-items:center;font-size:12px}.evidence--marked .annotation{display:block}.caption{padding:15px 2px 18px;border-bottom:1px solid var(--line)}.caption__title{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:.02em}.caption__meta{display:flex;justify-content:space-between;gap:12px;margin-top:7px;color:var(--muted);font-size:13px}
    .record-summary{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin:20px 0;padding:18px 0;border-bottom:1px solid var(--line)}.record-summary__label,.small-note{color:var(--muted);font-size:13px}.record-summary__value{margin-top:5px;font-family:var(--display);font-size:22px;font-weight:500;line-height:1.28}.record-summary__side{padding-left:16px;border-left:1px solid var(--line)}.rule-row{width:100%;padding:15px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}.rule-row__label{font-size:16px;font-weight:600}.rule-row__value{color:var(--muted);font-size:13px}.rule-row__arrow{color:var(--muted);font-size:19px}.small-note{margin:14px 0 7px}.notice{margin:16px 0;padding:12px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    .primary{width:100%;min-height:54px;border-radius:8px;background:var(--orange);color:var(--ink);font-size:18px;font-weight:600}.primary:hover{background:var(--orange-strong)}.tabbar{display:flex;min-height:72px;padding:7px 14px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:13px}.tab::before{content:"";position:absolute;top:0;width:18px;height:2px;background:transparent}.tab.is-current{color:var(--ink);font-weight:600}.tab.is-current::before{background:var(--orange)}.tab img{width:22px;height:22px}.capture-input{display:block;width:100%;margin:14px 0 0;padding:12px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:8px}.capture-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-top:24px}.capture-head h2{margin:0;font-family:var(--body);font-size:22px;font-weight:600}.capture-picker{display:flex;min-height:48px;margin-top:14px;align-items:center;justify-content:center;border-radius:8px;background:var(--orange);font-weight:600;cursor:pointer}.capture-picker input{display:none}.capture-picker--compact{min-height:44px;margin:0;padding-left:12px;background:transparent;color:var(--ink);font-size:13px}.voice-button{width:100%;min-height:48px;margin:14px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}.toolset{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}.tool{position:relative;min-height:44px;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--muted);font-size:13px}.tool.is-selected{color:#B74F2D;font-weight:600}.tool.is-selected::after{position:absolute;bottom:-1px;left:50%;width:22px;height:2px;background:var(--orange);content:"";transform:translateX(-50%)}.report-head{border-top:3px solid var(--orange);padding:18px 0 22px;border-bottom:1px solid var(--line)}.report-head__top{display:flex;align-items:center;justify-content:space-between;gap:12px}.report-head__identity{display:flex;align-items:center;gap:9px}.report-head__mark{width:32px;height:32px}.report-head__product{font-family:var(--display);font-size:15px;font-weight:500;letter-spacing:.08em}.report-head__kind{margin-top:2px;color:var(--muted);font-size:11px;letter-spacing:.08em}.report-head__no{color:var(--muted);font-size:11px;letter-spacing:.08em}.report-head__company{color:var(--muted);font-size:13px}.report-head h2{margin:16px 0 0;font-family:var(--display);font-size:32px;font-weight:500;letter-spacing:-.025em}.report-head__issuer{display:flex;align-items:center;gap:8px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line);font-size:13px}.report-head__issuer span{color:var(--muted);font-size:11px}.report-head__person{margin-top:12px;color:var(--muted);font-size:13px}.report-group-title{margin:24px 0 12px;font-family:var(--body);font-size:22px;font-weight:600;line-height:1.3}.profile-company{display:flex;align-items:center;gap:14px;margin:20px 0;padding:16px 0;background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0}.profile-logo{width:54px;height:54px;flex:0 0 auto;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px}.profile-logo img{width:100%;height:100%;object-fit:cover}
    @media(max-width:720px){.layout{display:block;padding:0}.notes{display:none}.phone{width:min(100%,430px);height:100dvh;margin:auto;box-shadow:none}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="notes"><div class="notes__identity"><img class="notes__mark" src="haoli-symbol-v8.png" alt="毫厘智管"><div class="notes__brand">毫厘智管 / FIELD NOTES</div></div><h1>让每一张现场照片，<br>都有可追溯的去处。</h1><p>这不是施工管理面板。项目只定义记录归属；拍摄、标注、核对和报告是一条连续的记录链。</p><div class="rules"><div><span>底色</span><span>温润纸感，而不是企业后台白</span></div><div><span>当前状态</span><span>中性墨黑＋朱橙短线，不使用主题色块</span></div><div><span>关键动作</span><span>朱砂橙，只出现在拍摄、保存、标注</span></div><div><span>主内容</span><span>真实现场照片；未拍摄时诚实留空</span></div></div></aside>
    <section class="phone" aria-label="毫厘智管交互母版">
      <header class="topbar"><button class="topbar__back hidden" id="back" onclick="go(backScreen())">‹ 返回</button><span class="topbar__brand" id="bar-title">毫厘智管</span><span id="bar-side">记录 · 标注 · 报告</span></header>
      <main class="main" id="screen"></main><div class="footer" id="footer"></div><nav class="tabbar" id="tabs"></nav>
    </section>
  </div>
  <script>
    const ICON='../../miniprogram/images/icons/', tabs=[['projects','icon-tab-project.svg','项目'],['reports','icon-tab-report.svg','报告'],['profile','icon-tab-profile.svg','我的']];
    let screen='projects',photo='',marked=false,note='',published=false,company='',inspector='',phone='',logo='',returnScreen='profile';
    const $=s=>document.querySelector(s), esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), btn=(label,action,kind='primary')=>`<button class="${kind}" onclick="${action}">${label}</button>`, projectName='示例项目';
    function go(next){screen=next;render()} function backScreen(){return({detail:'projects',capture:'detail',annotate:'capture',review:'capture',report:'reports',settings:returnScreen})[screen]||'projects'}
    function photoPanel(){const image=photo?`<img src="${photo}" alt="本地选择的演示现场照片">`:`<div class="evidence__empty"><strong>现场照片在这里</strong>拍摄或从相册添加后，原图与标注将一同保存。</div>`;return `<section class="evidence ${marked?'evidence--marked':''}"><div class="evidence__media">${image}<div class="annotation"><span>1</span></div>${photo?'<div class="evidence__count">1 / 1</div>':''}</div>${photo?'<div class="caption"><div class="caption__title">现场照片</div><div class="caption__meta"><span>本机草稿</span><span>未提交</span></div></div>':''}</section>`}
    function projects(){return `<div class="heading"><div><h1 class="page-title">项目</h1><p class="subtitle">选择一个项目，归档每次现场记录</p></div>${btn('新建项目',"go('detail')",'compact')}</div><input class="search" placeholder="搜索项目名称或地址" aria-label="搜索项目"><button class="project-card" onclick="go('detail')"><div class="project-card__title">${projectName}</div><div class="project-card__address">示例地址 · 项目资料仅用于记录归属</div><div class="project-card__footer"><span>${photo?'1 张现场照片':'尚无现场照片'}</span><span>进入项目　›</span></div></button>`}
    function detail(){return `<div class="eyebrow">当前项目</div><h1 class="page-title page-title--object">${projectName}</h1><p class="subtitle">记录始终归属这个项目；不会切换到其他项目。</p>${photoPanel()}<div class="record-summary"><div><div class="record-summary__label">记录状态</div><div class="record-summary__value">${photo?'现场记录中':'等待第一张照片'}</div></div><div class="record-summary__side"><div class="record-summary__label">本项目</div><div class="record-summary__value">${photo?'1':'0'} 张<br><span class="subtitle">现场照片</span></div></div></div><button class="rule-row" onclick="go('reports')"><span class="rule-row__label">历史记录与报告</span><span class="rule-row__arrow">›</span></button>`}
    function capture(){const picker=`<label class="capture-picker ${photo?'capture-picker--compact':''}">${photo?'继续添加':'拍照或添加照片'}<input type="file" accept="image/*" aria-label="选择现场照片" onchange="pickPhoto(this)"></label>`;return `<div class="eyebrow">${projectName} / 本机草稿</div><h1 class="page-title">现场记录</h1><p class="subtitle">先拍照，再补充必要说明；不强制把每张照片变成问题。</p><div class="capture-head"><div><h2>现场照片</h2><p class="subtitle">一张照片可标注多处问题</p></div>${photo?picker:''}</div>${photo?`<div onclick="go('annotate')">${photoPanel()}</div>`:picker}<button class="voice-button">按住说话</button><textarea class="text-area" placeholder="录音会转成文字，也可以直接手动补充" oninput="note=this.value">${esc(note)}</textarea><p class="notice">AI 整理是可选项；照片不会因为没有问题而丢失。</p>`}
    function annotate(){return `<div class="eyebrow">现场照片 / 精准标注</div><h1 class="page-title">标注位置</h1><p class="subtitle">选择、移动、撤销与保存必须保留原图坐标。</p>${photoPanel()}<div class="toolset"><button class="tool">选择</button><button class="tool is-selected" onclick="marked=true;render()">矩形</button><button class="tool" onclick="marked=false;render()">撤销</button></div><p class="notice">母版演示状态；正式小程序使用真实画布、缩放与手势坐标。</p>`}
    function review(){return `<div class="eyebrow">人工核对</div><h1 class="page-title">确认内容</h1><p class="subtitle">AI 提供建议，最终内容由巡查人确认。</p>${photoPanel()}<div class="small-note">照片说明</div><textarea class="text-area" oninput="note=this.value">${esc(note)}</textarea><button class="rule-row" onclick="returnScreen='review';go('settings')"><span><span class="rule-row__label">报告抬头与联系人</span><br><span class="rule-row__value">${company||'个人出具'}</span></span><span class="rule-row__arrow">›</span></button><p class="notice">零问题照片会保留为现场记录；“生成报告”不等同于工程验收通过。</p>`}
    function reports(){return `<div class="heading"><div><h1 class="page-title">报告</h1><p class="subtitle">仅展示已确认并发布的单份报告</p></div></div>${published?`<button class="rule-row" onclick="go('report')"><span><span class="rule-row__label">${projectName} · 现场记录报告</span><br><span class="rule-row__value">人工确认 · 在线只读</span></span><span class="rule-row__arrow">›</span></button>`:'<p class="notice">暂无报告。完成现场记录与人工核对后，报告会显示在这里。</p>'}`}
    function report(){return `<section class="report-head"><div class="report-head__top"><div class="report-head__identity"><img class="report-head__mark" src="haoli-symbol-v8.png" alt=""><div><div class="report-head__product">毫厘智管</div><div class="report-head__kind">现场记录报告</div></div></div><div class="report-head__no">HLZG-20260922-0001</div></div><h2>${projectName}</h2><div class="subtitle">现场记录报告</div><div class="report-head__issuer"><span>报告出具单位</span><strong>${esc(company||'个人出具')}</strong></div><div class="report-head__person">巡查人：${esc(inspector||'未填写')}${phone?' · '+esc(phone):''}<br>报告出具人：${esc(inspector||'未填写')}</div></section>${photoPanel()}<div class="report-group-title">问题 一</div><p>${esc(note||'本组为现场照片记录，未添加问题说明。')}</p><button class="rule-row" onclick="returnScreen='report';go('settings')"><span class="rule-row__label">报告出具资料</span><span class="rule-row__value">${company||'完善'}　›</span></button><p class="notice">正式分享只发送这一份报告的独立只读链接，不会分享报告列表。</p>`}
    function profile(){const brand=logo?`<img src="${logo}" alt="公司 LOGO">`:'LOGO';return `<div class="eyebrow">我的</div><h1 class="page-title">资料与报告抬头</h1><p class="subtitle">这些资料用于新发布的报告；历史报告保持发布时的快照。</p><div class="profile-company"><div class="profile-logo">${brand}</div><div><div class="rule-row__label">${esc(company||'填写公司名称')}</div><div class="rule-row__value">${phone||'添加公开联系电话'}</div></div></div><button class="rule-row" onclick="returnScreen='profile';go('settings')"><span class="rule-row__label">公司名称与 LOGO</span><span class="rule-row__arrow">›</span></button><button class="rule-row" onclick="returnScreen='profile';go('settings')"><span class="rule-row__label">巡查人资料</span><span class="rule-row__value">${inspector||'待完善'}　›</span></button><p class="notice">分享时展示报告出具人和发布快照；二次转发者不会被标成巡查人。</p>`}
    function settings(){return `<div class="eyebrow">报告资料</div><h1 class="page-title">报告抬头</h1><p class="subtitle">资料保存后只用于之后发布的报告。</p><div class="small-note">公司名称</div><input id="company" class="text-input" value="${esc(company)}" placeholder="公司名称"><div class="small-note">公司 LOGO</div><input class="capture-input" type="file" accept="image/*" onchange="pickLogo(this)"><div class="small-note">巡查人与报告出具人</div><input id="inspector" class="text-input" value="${esc(inspector)}" placeholder="姓名"><div class="small-note">联系电话</div><input id="phone" class="text-input" value="${esc(phone)}" placeholder="报告中公开的联系电话">`}
    function content(){return({projects,detail,capture,annotate,review,reports,report,profile,settings}[screen])()} function footer(){if(screen==='projects')return btn('拍摄现场照片',"go('detail')");if(screen==='detail')return btn(photo?'继续现场记录':'拍摄现场照片',"go('capture')");if(screen==='capture')return btn('整理并核对',"go('review')");if(screen==='annotate')return btn('保存并返回',"go('capture')");if(screen==='review')return btn('确认内容并生成报告',"published=true;go('report')");if(screen==='report')return btn('转发这份报告',"alert('演示：正式小程序分享此报告的独立只读链接。')");if(screen==='settings')return btn('保存资料',"saveProfile()");return ''}
    function render(){const root=$('#screen');root.innerHTML=content();root.scrollTop=0;const foot=footer();$('#footer').innerHTML=foot;$('#footer').classList.toggle('hidden',!foot);const isRoot=tabs.some(([key])=>key===screen);$('#tabs').classList.toggle('hidden',!isRoot);$('#tabs').innerHTML=tabs.map(([key,icon,label])=>{const active=key===screen,src=active?icon.replace('.svg','-active.svg'):icon;return `<button class="tab ${active?'is-current':''}" onclick="go('${key}')"><img src="${ICON+src}" alt="">${label}</button>`}).join('');$('#bar-title').textContent=isRoot?'毫厘智管':({detail:'项目',capture:'现场记录',annotate:'精准标注',review:'人工核对',report:'巡查报告',settings:'报告资料'})[screen];$('#bar-side').textContent=isRoot?'记录 · 标注 · 报告':'';$('#back').classList.toggle('hidden',isRoot)}
    function pickPhoto(input){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{photo=reader.result;marked=false;render()};reader.readAsDataURL(file)} function pickLogo(input){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{logo=reader.result;render()};reader.readAsDataURL(file)} function saveProfile(){company=$('#company').value.trim();inspector=$('#inspector').value.trim();phone=$('#phone').value.trim();go(returnScreen)} render();
  </script>
</body>
</html>
