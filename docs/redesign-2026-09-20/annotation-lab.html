<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>毫厘智管 · 精准照片标注</title>
<style>
:root{--paper:#faf9f5;--ink:#292d26;--muted:#62695c;--line:#dedfd6;--accent:#a74934}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#e7e8e1;color:var(--ink)}button{font:inherit;cursor:pointer;min-height:44px;border:0;background:none;color:inherit;padding:8px 14px;border-radius:6px}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:2px solid #a74934;outline-offset:2px}.app{height:100dvh;max-width:1200px;margin:auto;display:flex;flex-direction:column;background:var(--paper)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:12px;border-bottom:1px solid var(--line)}h1{font-size:18px;font-weight:600;margin:0}header p{font-size:12px;color:var(--muted);margin:5px 0 0}.primary{background:var(--ink);color:#fff;padding:10px 20px;min-height:46px;white-space:nowrap}.subbar{display:flex;align-items:center;gap:4px;padding:6px 14px;font-size:13px;flex-wrap:wrap}.subbar #state{margin-right:auto;padding:0 8px;color:var(--muted);font-size:12px}.workspace{display:flex;flex:1;min-height:0}.stage{flex:1;min-width:0;position:relative;background:#222722;overflow:hidden;touch-action:none;overscroll-behavior:none}.stage>canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}.stage .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#171c17df;color:#f7f8ef;border:1px solid #ffffff20;border-radius:7px;font-size:12px;pointer-events:none;white-space:nowrap}.lens{position:absolute;top:15px;left:15px;width:148px;background:#faf9f5;border:2px solid #faf9f5;border-radius:9px;box-shadow:0 8px 20px #0005;pointer-events:none;display:none;overflow:hidden}.lens canvas{display:block;width:144px;height:120px}.lens span{display:block;padding:5px;text-align:center;font:11px ui-monospace,monospace;color:#363c31}.side{width:250px;padding:22px 18px;overflow:auto;border-left:1px solid var(--line)}.side h2{font-size:14px;margin:0 0 17px}.side p{font-size:13px;line-height:1.9;color:var(--muted)}.selection{border-block:1px solid var(--line);padding:17px 0;margin:20px 0}.selection strong{display:block;font-size:15px;margin:7px 0}.selection small{font-size:12px;color:var(--muted)}.nudge{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:12px}.nudge button{background:#eeefe7;font-size:15px}.nudge span{display:flex;align-items:center;justify-content:center;font-size:11px}.side #download{width:100%;border:1px solid var(--line);margin-top:12px;font-size:13px}.side .tiny{font-size:11px;color:#747b6b}.bottom{padding:10px 18px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}.tools{display:flex;gap:6px}.tools button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid transparent;font-size:13px;padding:8px}.tools button.active{background:var(--ink);color:#fff}.tools button:hover:not(.active){background:#edeee7}.bottom .row{display:flex;justify-content:space-between;align-items:center;padding-top:6px;font-size:12px;color:var(--muted)}.row button{font-size:12px}.row #delete{color:#a74934}.zoom{font-variant-numeric:tabular-nums;min-width:48px;text-align:center}.toast{position:fixed;bottom:155px;left:50%;transform:translateX(-50%);background:#101811ed;color:#fff;max-width:90%;padding:12px 17px;border-radius:6px;font-size:13px;z-index:5;display:none}.mini-actions{display:none}.sample{position:absolute;top:12px;right:12px;color:#e4e7da;background:#1b221bd9;padding:7px 10px;border-radius:5px;font-size:11px;pointer-events:none}#file{display:none}
@media(max-width:700px){header{padding:9px 14px}h1{font-size:17px}header p{font-size:11px}header .primary{font-size:13px;padding:8px 12px}.subbar{padding:3px 8px;gap:0}.subbar button{font-size:12px;padding:7px 9px}.subbar #state{font-size:11px}.side{display:none}.bottom{padding:6px 8px max(8px,env(safe-area-inset-bottom))}.tools{gap:2px}.tools button{font-size:12px;min-height:48px;padding:6px 3px}.stage .hint{font-size:11px;bottom:9px;padding:7px 10px}.bottom .row{padding-top:2px;font-size:11px}.row button{padding:5px 8px}.mini-actions{display:flex;justify-content:center;gap:3px}.mini-actions button{font-size:12px;min-height:36px;padding:5px 12px;background:#eff0e8}.lens{width:124px}.lens canvas{width:120px;height:104px}.lens span{font-size:10px}.app{height:100dvh}}
</style></head><body><main class="app"><header><div><h1>照片标注</h1><p>问题 一 · 原图保留，标注可再次修改</p></div><button class="primary" id="save">保存并返回</button></header><div class="subbar"><span id="state" role="status">正在载入照片</span><button id="zoom-out" aria-label="缩小">−</button><span class="zoom" id="zoom">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适合屏幕</button></div><div class="workspace"><div class="stage" id="stage"><canvas id="canvas" tabindex="0" aria-label="照片标注画布，双指缩放移动；选中标注后可用方向键微调"></canvas><span class="sample" id="sample">AI 示例图 · 非真实证据</span><div class="lens" id="lens"><canvas id="lens-canvas" width="288" height="240"></canvas><span id="coordinate"></span></div><div class="hint" id="hint">双指缩放 / 移动 · 单指选择标注</div></div><aside class="side"><h2>把落点放准，再确认。</h2><p>滚轮或双指缩放。选择标注后，拖动白色端点调整范围；拖动标注本身移动位置。</p><div class="selection"><small>当前选中</small><strong id="selected-name">未选中标注</strong><small>微调每次移动 1 个原图像素</small><div class="nudge"><div></div><button data-nudge="0,-1" aria-label="上移一个原图像素">↑</button><div></div><button data-nudge="-1,0" aria-label="左移一个原图像素">←</button><span>1 px</span><button data-nudge="1,0" aria-label="右移一个原图像素">→</button><div></div><button data-nudge="0,1" aria-label="下移一个原图像素">↓</button><div></div></div></div><p>拖动端点时，放大镜显示实际落点。缩放只改变视图，不改变标注坐标。</p><button id="download">导出原图尺寸 PNG</button><button id="export-json">下载可编辑标注数据</button><p class="tiny">浏览器交互原型。未接入微信云服务；真机触控与EXIF方向仍需专项验收。</p></aside></div><footer class="bottom"><div class="tools" role="toolbar" aria-label="标注工具"><button class="active" data-tool="select">选择</button><button data-tool="pan">移动</button><button data-tool="box">框选</button><button data-tool="ellipse">圈选</button><button data-tool="arrow">箭头</button><button data-tool="point">编号点</button></div><div class="row"><span id="count">0 处标注</span><div><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="delete" disabled>删除选中</button></div></div><div class="mini-actions"><button data-nudge="-1,0">←</button><button data-nudge="0,-1">↑</button><span style="align-self:center;font-size:11px;color:#62695c">微调 1px</span><button data-nudge="0,1">↓</button><button data-nudge="1,0">→</button><button id="mobile-export">导出</button></div></footer></main><div id="toast" class="toast" role="status"></div><input type="file" id="file" accept="image/*"><script src="annotation-geometry.js"></script><script src="annotation-lab.js"></script></body></html>
